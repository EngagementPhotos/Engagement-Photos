<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apni photos dhoondho</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<style>
:root{
  --bg:#0c1f1b;--bg2:#12302a;--panel:#143730;--line:rgba(217,180,106,.22);
  --ink:#f3efe6;--muted:#a9bdb5;--gold:#d9b46a;--gold-d:#b8924a;--on-gold:#2a1e05;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);line-height:1.6;
  background:radial-gradient(900px 500px at 50% -120px,#1b4a3f 0%,transparent 70%),var(--bg);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:40px 20px 72px}
header{text-align:center;max-width:560px;margin:0 auto 32px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,7vw,3.8rem);line-height:1.05;letter-spacing:-.01em;margin:0 0 14px}
header p{margin:0;color:var(--muted);font-size:1rem}
.privacy{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:.82rem;color:var(--gold)}
.privacy svg{width:14px;height:14px}

.stage{max-width:380px;margin:0 auto}
.frame{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,var(--panel),#0e2924);
  border:1px solid var(--line);box-shadow:0 30px 60px -28px rgba(0,0,0,.7)}
.frame{cursor:pointer}.frame.live{cursor:default}
.frame:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transform:scaleX(-1)}
.frame video[hidden]{display:none}
.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:.92rem;padding:24px;text-align:center}
.frame.live .hint,.frame.has-shot .hint{display:none}
.frame #shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.frame #shot[hidden]{display:none}
.hint svg{width:76px;height:76px;stroke:var(--gold);opacity:.8}
.c{position:absolute;width:34px;height:34px;border:2px solid var(--gold);opacity:.9;pointer-events:none}
.c.tl{top:16px;left:16px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.c.tr{top:16px;right:16px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.c.bl{bottom:16px;left:16px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.c.br{bottom:16px;right:16px;border-left:0;border-top:0;border-bottom-right-radius:12px}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
button,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem var(--sans);
  background:linear-gradient(180deg,#e6c27c,var(--gold-d));color:var(--on-gold);border:0;border-radius:12px;padding:13px 22px;cursor:pointer;
  min-height:46px;transition:transform .15s,box-shadow .15s,opacity .15s;box-shadow:0 10px 24px -12px rgba(217,180,106,.7)}
button:hover:not(:disabled),label.btn:hover{transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.alt,label.alt{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.alt:hover:not(:disabled),label.alt:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible,label.btn:focus-within,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button svg,label svg{width:18px;height:18px;flex:none}

.status{display:flex;align-items:center;justify-content:center;gap:10px;min-height:28px;margin:28px auto 0;color:var(--muted);font-size:.95rem;text-align:center}
.status.busy::before{content:"";width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:26px}
.card.new{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 2px var(--gold),0 0 28px rgba(217,180,106,.5)}100%{box-shadow:0 0 0 0 transparent}}
.card{border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.thumb{display:block;width:100%;aspect-ratio:4/5;padding:0;border:0;border-radius:0;background:#0e2924;cursor:zoom-in;overflow:hidden;box-shadow:none;min-height:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.thumb:hover img{transform:scale(1.03)}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;color:var(--gold);font-weight:600;font-size:.9rem;text-decoration:none;border-top:1px solid var(--line);transition:background .15s,color .15s}
.dl:hover{background:var(--gold);color:var(--on-gold)}
.dl svg{width:16px;height:16px}
#lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:rgba(5,14,12,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 150px);border-radius:14px;box-shadow:0 30px 80px -20px #000;object-fit:contain}
#lb .dl{border:0;border-radius:12px;padding:13px 26px;background:linear-gradient(180deg,#e6c27c,var(--gold-d));color:var(--on-gold)}
#lbx{position:absolute;top:14px;right:14px;width:44px;height:44px;padding:0;border-radius:50%;font-size:1.5rem;line-height:1}
@media (max-width:480px){.wrap{padding-top:28px}#grid{grid-template-columns:repeat(2,1fr);gap:10px}.actions button,.actions label{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<header>
  <h1>Apni photos dhoondho</h1>
  <p>Ek selfie lo, aur event ki saari photos jisme aap hain, kuch hi second me mil jayengi.</p>
  <span class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Aapka chehra sirf photos match karne ke liye use hota hai</span>
</header>

<main>
<div class="stage">
  <div class="frame" id="frame" role="button" tabindex="0" aria-label="Camera kholo" onclick="frameTap()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();frameTap()}">
    <video id="v" autoplay playsinline muted hidden></video>
    <img id="shot" alt="Aapki selfie" hidden>
    <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Selfie ke liye yahan tap karo</span></div>
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  </div>
  <div class="actions">
    <button class="alt" onclick="showAll()">Saari photos dekho</button>
    <input id="file" type="file" accept="image/*" capture="user" hidden>
  </div>
</div>
<p class="status busy" id="msg" role="status" aria-live="polite">Tayyari ho rahi hai... (pehli baar kuch second lagte hain)</p>
<div id="grid"></div>
</main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo preview" onclick="if(event.target===this)closeLb()">
  <button id="lbx" class="alt" onclick="closeLb()" aria-label="Band karo">&times;</button>
  <img id="lbimg" alt="Badi photo">
  <a id="lbdl" class="dl" target="_blank" rel="noopener" href="#"></a>
</div>
</div>

<script>
const MODEL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const THRESHOLD = 0.5; // chhota = sakht match
let faces = {}, files = [], ready = false, stream = null, scanning = false, token = 0,
  mode = null, myDesc = null, finding = false, lastFv = null; // mode: 'all' ya 'match' (live refresh ke liye)
const $ = id => document.getElementById(id);
const msg = (t, busy) => { const m = $('msg'); m.textContent = t; m.classList.toggle('busy', !!busy); };
const run = (fn, ...a) => new Promise((ok, no) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(new Error(e.message || e)))[fn](...a));

const TFD = n => new faceapi.TinyFaceDetectorOptions({ inputSize: n, scoreThreshold: 0.4 });
// Detector/landmark/recognition ko pehle se garam kar do, taaki pehla scan bhi tez ho
async function warmUp() {
  try {
    const a = document.createElement('canvas'); a.width = a.height = 160;
    const x = a.getContext('2d'); x.fillStyle = '#888'; x.fillRect(0, 0, 160, 160);
    await faceapi.detectSingleFace(a, TFD(224));
    const b = document.createElement('canvas'); b.width = b.height = 150;
    await faceapi.nets.faceRecognitionNet.computeFaceDescriptor(b);
    await faceapi.nets.faceLandmark68Net.detectLandmarks(b);
  } catch (_) {}
}
(async () => {
  try {
    try { await faceapi.tf.setBackend('webgl'); await faceapi.tf.ready(); } catch (_) {}
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL),
      run('getFaces').then(r => { faces = JSON.parse(r); }),
      run('listOutput').then(r => { files = r; })
    ]);
    await warmUp();
    ready = true; msg('Selfie ke liye upar frame par tap karo.'); live();
  } catch (e) { msg('Load nahi hua: ' + e.message); }
})();

const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
const shown = new Map();
function makeCard(f) {
  const dl = 'https://drive.google.com/uc?export=download&id=' + f.id;
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = '<button type="button" class="thumb" aria-label="Photo bada karo"><img loading="lazy" alt="Event photo" src="https://drive.google.com/thumbnail?id=' + f.id + '&sz=w400"></button><a class="dl" target="_blank" rel="noopener" href="' + dl + '">' + DL_ICON + 'Download HD</a>';
  d.querySelector('.thumb').onclick = () => openLb(f.id, dl);
  return d;
}
// quiet=true: auto-refresh, sirf nayi photos upar judti hain, baaki photos jaisi ki taisi rehti hain
function render(list, quiet) {
  const g = $('grid');
  msg(list.length ? list.length + ' photos mili. Bada dekhne ke liye photo par tap karo.' : 'Koi photo nahi mili. Dobara try karo ya "Saari photos dekho" dabao.');
  if (!quiet) {
    g.innerHTML = ''; shown.clear();
    list.forEach(f => { const el = makeCard(f); g.appendChild(el); shown.set(f.id, el); });
    return;
  }
  const ids = new Set(list.map(f => f.id));
  shown.forEach((el, id) => { if (!ids.has(id)) { el.remove(); shown.delete(id); } });
  list.filter(f => !shown.has(f.id)).reverse().forEach(f => { const el = makeCard(f); el.classList.add('new'); g.prepend(el); shown.set(f.id, el); });
}
const visible = () => mode === 'all' ? files
  : files.filter(f => (faces[f.name] || []).some(a => faceapi.euclideanDistance(a, myDesc) < THRESHOLD));
// Har 2 second me nayi photos check (chhoti call, server cache se)
async function refresh() {
  if (!ready || scanning || finding || document.hidden) return;
  try {
    const st = await run('liveState').catch(() => run('listOutput').then(l => ({ files: l, fv: null })));
    if (scanning || finding) return;
    const old = new Set(files.map(f => f.id));
    let changed = st.files.length !== files.length || st.files.some(f => !old.has(f.id));
    files = st.files;
    const needF = st.fv != null ? st.fv !== lastFv : files.some(f => faces[f.name] === undefined);
    if (needF) { faces = JSON.parse(await run('getFaces')); if (st.fv != null) lastFv = st.fv; changed = true; }
    if (changed && mode && !scanning && !finding) render(visible(), true);
  } catch (_) {}
}
async function live() { await refresh(); setTimeout(live, 2000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
function openLb(id, dl) {
  $('lbimg').src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';
  const a = $('lbdl'); a.href = dl; a.innerHTML = DL_ICON + 'Download HD';
  $('lb').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeLb() { $('lb').classList.remove('open'); $('lbimg').removeAttribute('src'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
function frameTap() {
  if (scanning) return;
  if (!ready) return msg('Abhi tayyari ho rahi hai...', true);
  openCam();
}
function showAll() { mode = 'all'; render(files); }
// Badi selfie ko chhota karo: detection ka sabse bada time yahi bachata hai
function shrink(src, max = 480) {
  const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height;
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
async function find(src) {
  if (!ready) return msg('Abhi tayyari ho rahi hai...', true);
  msg('Match ho raha hai...', true);
  const t0 = performance.now();
  finding = true;
  try {
    const c = shrink(src);
    let d = null;
    for (const size of [224, 320]) { // pehle sabse tez size, na mile to thoda bada
      d = await faceapi.detectSingleFace(c, TFD(size)).withFaceLandmarks().withFaceDescriptor();
      if (d) break;
    }
    if (!d) return msg('Chehra nahi mila. Roshni me, seedha camera dekho.');
    myDesc = d.descriptor; mode = 'match'; render(visible());
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    $('msg').textContent += ' (' + sec + ' sec)';
  } catch (e) { msg('Scan nahi hua: ' + e.message); }
  finally { finding = false; }
}
function stopCam() {
  scanning = false; token++;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('v').hidden = true; $('frame').classList.remove('live');
}
function showShot(c) {
  $('shot').src = c.toDataURL('image/jpeg', 0.8); $('shot').hidden = false; $('frame').classList.add('has-shot');
}
async function openCam() {
  $('shot').hidden = true; $('frame').classList.remove('has-shot');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
    const v = $('v'); v.srcObject = stream; v.hidden = false; $('frame').classList.add('live');
    await v.play().catch(() => {});
    msg('Chehra frame me rakho, selfie apne aap ho jayegi...', true);
    autoScan();
  } catch (e) { stopCam(); msg('Live camera nahi chala. Phone ka camera khol rahe hain...'); $('file').click(); }
}
// Chehra steady dikhte hi selfie apne aap le leta hai aur match shuru kar deta hai
async function autoScan() {
  scanning = true; const my = ++token, v = $('v'), t0 = Date.now(); let hits = 0;
  while (scanning && my === token) {
    if (Date.now() - t0 > 25000) { stopCam(); return msg('Chehra nahi mila. Roshni me aakar frame par dobara tap karo.'); }
    if (v.readyState >= 2 && v.videoWidth) {
      const d = await faceapi.detectSingleFace(shrink(v, 320), TFD(224));
      if (my !== token) return;
      if (d && d.score > 0.6) hits++; else hits = 0;
      if (hits >= 2) {
        const shot = shrink(v, 480);
        stopCam(); showShot(shot); await find(shot); return;
      }
    }
    await new Promise(r => setTimeout(r, 100));
  }
}
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { showShot(shrink(img)); find(img); };
  img.src = URL.createObjectURL(f); e.target.value = '';
};
</script></body></html>
